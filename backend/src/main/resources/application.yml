# All environment-specific values come from environment variables.
# The "local" profile (application-local.yml, activated by ./mvnw spring-boot:run) additionally imports the
# git-ignored project-root .env file. Tests and deployed environments never read .env.
spring:
  application:
    name: enterprise-admin-backend
  config:
    # Production secret injection: every file in SECRETS_DIR (Docker/Kubernetes secrets, default /run/secrets) becomes
    # a property named after the file, e.g. /run/secrets/JWT_SECRET → ${JWT_SECRET}. Real environment variables still
    # win. Optional: absent directories are ignored (local development, tests).
    import: optional:configtree:${SECRETS_DIR:/run/secrets/}
  autoconfigure:
    # No in-memory default user: authentication is designed in Phase 2, not generated by Boot.
    exclude: org.springframework.boot.security.autoconfigure.UserDetailsServiceAutoConfiguration

  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    hikari:
      pool-name: enterprise-admin-pool
      maximum-pool-size: ${DB_POOL_MAX_SIZE:10}
      connection-timeout: 5000
      validation-timeout: 2000

  flyway:
    # The schema is owned by versioned migrations in src/main/resources/db/migration.
    # Production (docker-compose.prod.yml) sets FLYWAY_ENABLED=false: a one-shot migration job runs Flyway with the
    # migration account first, so the long-running backend never holds DDL credentials.
    enabled: ${FLYWAY_ENABLED:true}
    # Production: migrate as a separate migration account (DDL rights) while the app runs as the runtime account.
    # Unset = local single-user development (the datasource account migrates).
    user: ${FLYWAY_USER:${DB_USERNAME}}
    password: ${FLYWAY_PASSWORD:${DB_PASSWORD}}
    locations: classpath:db/migration
    validate-on-migrate: true
    clean-disabled: true

  jpa:
    open-in-view: false
    hibernate:
      # Hibernate only validates entities against the Flyway-managed schema; it never creates, alters or drops
      # tables. Never use create/create-drop/update against shared data.
      ddl-auto: ${JPA_DDL_AUTO:validate}
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
        # Loads lazy collections (e.g. user roles on a page of users) in batches instead of one query per row.
        default_batch_fetch_size: 50

  jackson:
    default-property-inclusion: non_null
    deserialization:
      # Unknown JSON fields are rejected (400 UNKNOWN_FIELD) instead of silently ignored, so attempts to set
      # properties an endpoint does not accept (roles, ids, audit fields, …) are explicit, never quietly dropped.
      fail-on-unknown-properties: true

server:
  port: ${SERVER_PORT:8080}
  # Only behind a trusted reverse proxy that overwrites X-Forwarded-For/-Proto: set to "framework" (or "native").
  # Otherwise clients could spoof their IP (rate limits, audit) — keep "none" when exposed directly.
  forward-headers-strategy: ${FORWARD_HEADERS_STRATEGY:none}
  shutdown: graceful
  error:
    include-stacktrace: never
    include-message: never
    include-binding-errors: never
    include-exception: false
    whitelabel:
      enabled: false

app:
  db:
    # Least-privilege runtime account (see docs/SECURITY.md "Database privilege model"). Empty = local single user.
    runtime-user: ${DB_RUNTIME_USER:}
    runtime-user-host: ${DB_RUNTIME_USER_HOST:%}
    verify-least-privilege: ${DB_VERIFY_LEAST_PRIVILEGE:false}

  cors:
    # Comma-separated list of exact origins allowed to call the API from a browser. Empty = none. No wildcards.
    allowed-origins: ${ALLOWED_ORIGINS:}

  security:
    jwt:
      # Required, no default: startup fails if missing or shorter than 32 bytes.
      secret: ${JWT_SECRET:}
      issuer: ${JWT_ISSUER:enterprise-admin}
      audience: ${JWT_AUDIENCE:enterprise-admin-web}
      access-token-ttl: ${JWT_ACCESS_TOKEN_TTL:15m}
      clock-skew: 30s
    refresh-token:
      ttl: ${REFRESH_TOKEN_TTL:7d}
      max-session-lifetime: ${REFRESH_SESSION_MAX_LIFETIME:30d}
      reuse-grace-period: 30s
      cleanup-cron: "0 17 3 * * *"
      cookie:
        name: ${REFRESH_COOKIE_NAME:ea_refresh_token}
        # Secure by default. Only local HTTP development sets REFRESH_COOKIE_SECURE=false.
        secure: ${REFRESH_COOKIE_SECURE:true}
        same-site: ${REFRESH_COOKIE_SAME_SITE:Strict}
        path: /api/auth
    password:
      bcrypt-strength: ${BCRYPT_STRENGTH:12}
    hsts:
      # Sent only on HTTPS requests. Disable only for environments that are not served over TLS at all.
      enabled: ${HSTS_ENABLED:true}
      max-age: 365d
    rate-limit:
      enabled: ${RATE_LIMIT_ENABLED:true}
      # jdbc = counters in MySQL, shared by every instance (multi-instance safe). memory = single instance only.
      store: ${RATE_LIMIT_STORE:jdbc}
      policies:
        login-ip: { limit: 30, window: 1m }
        login-account-failure: { limit: 10, window: 15m }
        refresh-ip: { limit: 120, window: 1m }
        password-change: { limit: 5, window: 15m }
        profile-update: { limit: 20, window: 1m }
        admin-mutation: { limit: 120, window: 1m }
        account-mutation: { limit: 120, window: 1m }
    login-protection:
      max-failures-per-account: 5
      max-failures-per-client: 20
      window: 15m
      base-lockout: 1m
      max-lockout: 15m
      max-tracked-keys: 10000

  bootstrap:
    admin:
      # Used only while no ADMIN account exists. Never logged.
      email: ${ADMIN_EMAIL:}
      password: ${ADMIN_PASSWORD:}
      first-name: ${ADMIN_FIRST_NAME:System}
      last-name: ${ADMIN_LAST_NAME:Administrator}

  notifications:
    # Read notifications older than this are purged nightly; unread ones are always kept.
    read-retention: 90d
    cleanup-cron: "0 37 3 * * *"

logging:
  pattern:
    # Every log line carries the request correlation id (blank outside a request).
    correlation: "[%X{requestId:-}] "
  level:
    root: INFO
