# GENERATED from security-headers.json by `npm run security:headers` — do not edit by hand.
# Included by every location that serves the SPA (nginx drops inherited add_header when a location adds its own).
add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'sha256-+mOEaVXkx47ZX17adDtM9Up360KvsmPmBJOlzm8ukK4='; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; worker-src 'self'; manifest-src 'self'" always;
add_header Referrer-Policy "no-referrer" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Permissions-Policy "accelerometer=(), camera=(), geolocation=(), gyroscope=(), magnetometer=(), microphone=(), payment=(), usb=()" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
# HSTS: only for HTTPS requests ($hsts_value is empty otherwise, and nginx then omits the header).
add_header Strict-Transport-Security $hsts_value always;
